<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijkstra's Algorithm Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f9fafb; /* Tailwind gray-50 */
            user-select: none;
        }
        #graph-container {
            width: 100%;
            height: 100%;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        svg {
            max-width: 100%;
            max-height: 100%;
        }
        .queue-item {
            transition: all 0.2s ease-in-out;
        }
        /* מניעת השהיית מגע באייפד ושיפור מהירות הלחיצה */
        button {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="flex flex-col h-screen font-sans text-gray-800">

    <!-- סרגל כותרת ולחצני שליטה עם onclick ישיר שעובד תמיד -->
    <div class="relative bg-white shadow-sm border-b border-gray-200 px-4 py-3 flex flex-row justify-between items-center z-10 shrink-0">
        <div>
            <h1 class="text-xl font-bold text-gray-800 tracking-tight">Dijkstra's Algorithm</h1>
            <p class="text-xs text-gray-500">Step-by-step CLRS simulation</p>
        </div>
        
        <div class="flex items-center space-x-2">
            <button onclick="prevStep()" id="btn-prev" class="cursor-pointer px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                &larr; הקודם
            </button>
            <span id="step-counter" class="text-xs font-semibold w-16 text-center text-gray-600">צעד 0/0</span>
            <button onclick="nextStep()" id="btn-next" class="cursor-pointer px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                הבא &rarr;
            </button>
            <button onclick="resetSimulation()" id="btn-reset" class="cursor-pointer p-1.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-600 rounded-lg transition-colors" title="אתחול מחדש">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
        </div>
    </div>

    <!-- שורת הודעות והסבר על הצעד הנוכחי -->
    <div class="bg-blue-50 border-b border-blue-100 px-4 py-2 shrink-0">
        <p id="status-message" class="text-blue-800 font-medium text-center md:text-left text-sm md:text-base h-6 overflow-hidden truncate"></p>
    </div>

    <!-- האזור המרכזי בעיצוב מחולק לשמאל וימין -->
    <div class="flex-1 flex flex-col md:flex-row p-4 gap-4 min-h-0 overflow-hidden">
        
        <!-- פאנל שמאלי (3/4 רוחב): גרף מלא עם משקלים ומקרא צבעים צף -->
        <div class="flex-1 md:w-3/4 flex flex-col min-h-0 relative">
            <!-- אזור הגרף -->
            <div class="flex-1 bg-white border border-gray-200 rounded-xl p-2 flex items-center justify-center min-h-0 shadow-sm relative">
                <div id="graph-container">
                    <svg id="graph-svg" viewBox="0 0 650 350" preserveAspectRatio="xMidYMid meet">
                        <defs>
                            <marker id="arrow-default" viewBox="0 0 10 10" refX="21" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94a3b8" />
                            </marker>
                            <marker id="arrow-active" viewBox="0 0 10 10" refX="21" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#3b82f6" />
                            </marker>
                            <marker id="arrow-tree" viewBox="0 0 10 10" refX="21" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#10b981" />
                            </marker>
                        </defs>
                        <!-- הקווים והקודקודים יוזרקו דינמית על ידי ה-JS -->
                    </svg>
                </div>

                <!-- מקרא צבעי קשתות צף -->
                <div class="absolute bottom-3 left-3 bg-white/95 backdrop-blur-sm border border-gray-200 rounded-xl p-2.5 shadow-sm text-[10px] md:text-xs flex flex-col gap-1.5 z-20 w-32 md:w-36" dir="rtl">
                    <span class="font-bold text-gray-700 border-b border-gray-100 pb-1 mb-0.5">קשתות ומצבים:</span>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-1.5 bg-[#cbd5e1] rounded-sm shrink-0"></span>
                        <span class="text-gray-600">קשת רגילה</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-1.5 bg-[#3b82f6] rounded-sm shrink-0"></span>
                        <span class="text-gray-600">נבחנת כעת (Relax)</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-1.5 bg-[#10b981] rounded-sm shrink-0"></span>
                        <span class="text-gray-600">מסלול קצר (Tree)</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- פאנל ימני (1/4 רוחב): מערכי d ו-pi, תור עדיפויות Q, והקבוצה S -->
        <div class="md:w-1/4 flex flex-col space-y-3 min-h-0 shrink-0 justify-start overflow-y-auto pr-1">
            <!-- אזור טבלת האבות והמרחקים -->
            <div class="bg-white border border-gray-200 rounded-xl p-3 flex flex-col shadow-sm shrink-0">
                <span class="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider text-center shrink-0" dir="rtl">מרחקים (d) ואבות (&pi;)</span>
                <div id="pi-array-container" class="w-full mt-1 shrink-0">
                    <!-- הטבלה המוזרקת כאן -->
                </div>
            </div>

            <!-- תצוגת תור העדיפויות (Q) - ממוין תמיד לפי d[v] מינימלי -->
            <div class="bg-white border border-gray-200 shadow-sm rounded-xl p-3 flex flex-col shrink-0">
                <span class="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider text-center">תור עדיפויות (Q)</span>
                <div class="flex items-center justify-center gap-2 mt-1">
                    <span class="text-lg italic font-serif text-gray-300">Q</span>
                    <div id="queue-container" class="flex flex-wrap gap-1.5 items-center justify-center">
                        <!-- איברי התור יוזרקו כאן -->
                    </div>
                </div>
            </div>

            <!-- קבוצת הקודקודים הסגורים (S) -->
            <div class="bg-emerald-50 border border-emerald-100 shadow-sm rounded-xl p-3 flex flex-col justify-center shrink-0" dir="rtl">
                <span class="text-xs font-bold text-emerald-800 mb-2 uppercase tracking-wider text-center">הקבוצה S (מסלול סופי נקבע)</span>
                <div class="font-semibold bg-white/60 px-2.5 py-1.5 rounded border border-emerald-200/50 truncate text-xs text-emerald-900" dir="ltr" id="s-set-container">
                    S = &empty;
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- הגדרות הגרף המכוון הרשמי מתוך ה-CLRS (דייקסטרה) ---
        const nodesData = [
            {id: 's', x: 100, y: 175, pos: 'left'},
            {id: 't', x: 275, y: 75, pos: 'top'},
            {id: 'y', x: 275, y: 275, pos: 'bottom'},
            {id: 'x', x: 475, y: 75, pos: 'top'},
            {id: 'z', x: 475, y: 275, pos: 'bottom'}
        ];

        // 10 קשתות ממושקלות ומכוונות
        const edgesData = [
            {u: 's', v: 't', w: 10, isCurved: false},
            {u: 's', v: 'y', w: 5, isCurved: false},
            {u: 't', v: 'y', w: 2, isCurved: true, dir: -1}, // curve left
            {u: 'y', v: 't', w: 3, isCurved: true, dir: -1}, // curve right (when viewed from y to t)
            {u: 't', v: 'x', w: 1, isCurved: false},
            {u: 'y', v: 'x', w: 9, isCurved: false},
            {u: 'y', v: 'z', w: 2, isCurved: false},
            {u: 'x', v: 'z', w: 4, isCurved: true, dir: -1},
            {u: 'z', v: 'x', w: 6, isCurved: true, dir: -1},
            {u: 'z', v: 's', w: 7, isCurved: true, dir: 1}  // curved sweep below
        ];

        const adjList = {
            's': [{v: 't', w: 10}, {v: 'y', w: 5}],
            't': [{v: 'x', w: 1}, {v: 'y', w: 2}],
            'y': [{v: 't', w: 3}, {v: 'x', w: 9}, {v: 'z', w: 2}],
            'x': [{v: 'z', w: 4}],
            'z': [{v: 'x', w: 6}, {v: 's', w: 7}]
        };

        let states = [];
        
        function generateDijkstraStates() {
            states = [];
            let currentState = {
                nodes: {
                    s: { color: 'white', d: '∞', pi: 'NIL' },
                    t: { color: 'white', d: '∞', pi: 'NIL' },
                    x: { color: 'white', d: '∞', pi: 'NIL' },
                    y: { color: 'white', d: '∞', pi: 'NIL' },
                    z: { color: 'white', d: '∞', pi: 'NIL' }
                },
                q: [],
                sSet: [],
                treeEdges: [],
                activeEdge: null,
                processingNode: null,
                msg: "אתחול: המרחק לכל הקודקודים הוא ∞, ומערך האבות NIL."
            };

            const pushState = (msg) => {
                states.push(JSON.parse(JSON.stringify({...currentState, msg})));
            };

            pushState(currentState.msg);

            // Initialize Single Source
            currentState.nodes['s'].d = 0;
            currentState.nodes['s'].color = 'gray';
            currentState.q = [
                { id: 's', d: 0 },
                { id: 't', d: Infinity },
                { id: 'x', d: Infinity },
                { id: 'y', d: Infinity },
                { id: 'z', d: Infinity }
            ];
            pushState("אתחול מקור: נקבע d[s] = 0. כל הקודקודים מוכנסים לתור העדיפויות Q.");

            let q = [
                { id: 's', d: 0 },
                { id: 't', d: Infinity },
                { id: 'x', d: Infinity },
                { id: 'y', d: Infinity },
                { id: 'z', d: Infinity }
            ];
            let d = { s: 0, t: Infinity, x: Infinity, y: Infinity, z: Infinity };
            let pi = { s: 'NIL', t: 'NIL', x: 'NIL', y: 'NIL', z: 'NIL' };
            let color = { s: 'gray', t: 'white', x: 'white', y: 'white', z: 'white' };
            let sSet = [];
            let treeEdges = [];

            while (q.length > 0) {
                // Min-Priority Queue Sort (Infinity to the end)
                q.sort((a, b) => {
                    if (a.d === Infinity && b.d === Infinity) return 0;
                    if (a.d === Infinity) return 1;
                    if (b.d === Infinity) return -1;
                    return a.d - b.d;
                });
                
                currentState.q = q.map(item => ({ id: item.id, d: d[item.id] === Infinity ? '∞' : d[item.id] }));

                // Extract Min
                let uObj = q.shift();
                let u = uObj.id;
                currentState.processingNode = u;
                color[u] = 'black';
                currentState.nodes[u].color = 'black';
                sSet.push(u);
                currentState.sSet = [...sSet];
                currentState.q = q.map(item => ({ id: item.id, d: d[item.id] === Infinity ? '∞' : d[item.id] }));
                pushState("Extract-Min(Q): הקודקוד " + u + " נבחר (d=" + (d[u] === Infinity ? '∞' : d[u]) + ") ומוכנס ל-S.");

                // Relax neighbors
                for (let edge of adjList[u]) {
                    let v = edge.v;
                    let w = edge.w;

                    // Skip relaxation if already processed in S
                    if (sSet.includes(v)) continue;

                    currentState.activeEdge = { u, v };
                    pushState("בוחנים את הקשת המכוונת (" + u + ", " + v + ") בעלת משקל " + w + ". d[" + v + "] הנוכחי הוא " + (d[v] === Infinity ? '∞' : d[v]) + ".");

                    if (d[v] > d[u] + w) {
                        d[v] = d[u] + w;
                        pi[v] = u;
                        color[v] = 'gray';

                        // Update d value inside the priority queue Q
                        let qIdx = q.findIndex(item => item.id === v);
                        if (qIdx !== -1) {
                            q[qIdx].d = d[v];
                        }

                        currentState.nodes[v] = { color: 'gray', d: d[v], pi: u };
                        
                        // Update shortest path tree edges
                        treeEdges = treeEdges.filter(e => e.v !== v);
                        treeEdges.push({ u, v });
                        currentState.treeEdges = [...treeEdges];

                        pushState("Relaxation (הקלה): נמצא מסלול קצר יותר! מעדכנים d[" + v + "] = " + d[v] + " וכן &pi;[" + v + "] = " + u + ".");
                    } else {
                        pushState("אין קיצור דרך: d[" + v + "] כבר קטן או שווה ל-d[" + u + "] + " + w + ". נדלג.");
                    }
                    currentState.activeEdge = null;
                }

                currentState.processingNode = null;
                pushState("סיימנו להרפות את כל קשתות הקודקוד " + u + ". הוא כעת סגור לחלוטין.");
            }

            pushState("תור העדיפויות Q ריק! אלגוריתם דייקסטרה הסתיים בהצלחה.");
        }

        let currentStep = 0;

        function render() {
            const state = states[currentStep];
            
            document.getElementById('status-message').innerHTML = state.msg;
            document.getElementById('step-counter').innerText = `צעד ${currentStep} / ${states.length - 1}`;
            document.getElementById('btn-prev').disabled = currentStep === 0;
            document.getElementById('btn-next').disabled = currentStep === states.length - 1;

            const svg = document.getElementById('graph-svg');
            const defs = svg.querySelector('defs').outerHTML;
            let svgContent = defs;

            // ציור קשתות הגרף מבוסס פונקציה אונליין שמחשבת מרחקי גבולות צמתים (Radius=25)
            edgesData.forEach(e => {
                const isActive = state.activeEdge && (state.activeEdge.u === e.u && state.activeEdge.v === e.v);
                const isTree = state.treeEdges.some(te => te.u === e.u && te.v === e.v);

                let stroke = '#cbd5e1'; // slate-300
                let strokeWidth = 2.5;
                let markerId = "arrow-default";

                if (isActive) {
                    stroke = '#3b82f6'; // blue-500
                    strokeWidth = 4.5;
                    markerId = "arrow-active";
                } else if (isTree) {
                    stroke = '#10b981'; // emerald-500
                    strokeWidth = 4;
                    markerId = "arrow-tree";
                }

                // חישוב נקודות קצה על פני היקף הקודקוד (רדיוס 25)
                const n1 = nodesData.find(n => n.id === e.u);
                const n2 = nodesData.find(n => n.id === e.v);
                const r = 25;

                const dx = n2.x - n1.x;
                const dy = n2.y - n1.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const ux = dx / dist;
                const uy = dy / dist;

                const x1 = n1.x + r * ux;
                const y1 = n1.y + r * uy;
                const x2 = n2.x - r * ux;
                const y2 = n2.y - r * uy;

                // קשתות מקושתות (Bezier) או ישרות
                if (e.isCurved) {
                    const nx = -uy;
                    const ny = ux;
                    const cx = (n1.x + n2.x) / 2 + nx * (e.dir * 35);
                    const cy = (n1.y + n2.y) / 2 + ny * (e.dir * 35);

                    svgContent += `
                        <path d="M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}" 
                              fill="none" 
                              stroke="${stroke}" 
                              stroke-width="${strokeWidth}" 
                              marker-end="url(#${markerId})" />
                    `;
                } else {
                    svgContent += `
                        <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" 
                              stroke="${stroke}" 
                              stroke-width="${strokeWidth}" 
                              marker-end="url(#${markerId})" />
                    `;
                }

                // רישום משקלי קשתות
                let wp;
                if (e.isCurved) {
                    const nx = -uy;
                    const ny = ux;
                    const cx = (n1.x + n2.x) / 2 + nx * (e.dir * 35);
                    const cy = (n1.y + n2.y) / 2 + ny * (e.dir * 35);
                    const bx = 0.25 * n1.x + 0.5 * cx + 0.25 * n2.x;
                    const by = 0.25 * n1.y + 0.5 * cy + 0.25 * n2.y;
                    wp = { x: bx + nx * (e.dir * 15), y: by + ny * (e.dir * 15) };
                } else {
                    const nx = -uy;
                    const ny = ux;
                    wp = { x: (n1.x + n2.x) / 2 + nx * 12, y: (n1.y + n2.y) / 2 + ny * 12 };
                }

                svgContent += `
                    <rect x="${wp.x - 8}" y="${wp.y - 8}" width="16" height="16" fill="#ffffff" rx="3" />
                    <text x="${wp.x}" y="${wp.y}" fill="#374151" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">${e.w}</text>
                `;
            });

            // ציור קודקודים
            nodesData.forEach(n => {
                const nodeState = state.nodes[n.id];
                let fill = '#ffffff';
                let textColor = '#111827';
                
                if (nodeState.color === 'gray') { fill = '#d1d5db'; }
                if (nodeState.color === 'black') { fill = '#374151'; textColor = '#ffffff'; }

                const isProcessing = state.processingNode === n.id;
                const stroke = isProcessing ? '#3b82f6' : '#1f2937';
                const strokeWidth = isProcessing ? 5 : 2;

                svgContent += `<circle cx="${n.x}" cy="${n.y}" r="25" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" />`;
                
                // תצוגת מרחק d בתוך הצומת
                const distText = nodeState.d === Infinity ? '∞' : nodeState.d;
                svgContent += `<text x="${n.x}" y="${n.y + 1}" fill="${textColor}" font-size="16" font-family="sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="central">${distText}</text>`;
                
                // תווית שם קודקוד
                let lx = n.x, ly = n.y;
                if (n.pos === 'top') { ly -= 38; }
                else if (n.pos === 'bottom') { ly += 38; }
                else if (n.pos === 'left') { lx -= 38; }
                
                svgContent += `<text x="${lx}" y="${ly}" fill="#4b5563" font-size="20" font-family="serif" font-style="italic" text-anchor="middle" dominant-baseline="central">${n.id}</text>`;
            });

            svg.innerHTML = svgContent;

            // 3. רינדור תור עדיפויות (Q)
            const qContainer = document.getElementById('queue-container');
            if (state.q.length === 0) {
                qContainer.innerHTML = `<div class="text-gray-400 italic text-xs py-1 px-2">ריק</div>`;
            } else {
                let qHTML = '';
                state.q.forEach(qItem => {
                    qHTML += `
                        <div class="flex flex-col items-center queue-item">
                            <div class="w-8 h-8 border border-gray-500 bg-gray-200 flex items-center justify-center text-xs font-serif italic text-gray-800 shadow-sm rounded">
                                ${qItem.id}
                            </div>
                            <div class="text-[9px] font-bold text-gray-500 mt-0.5">${qItem.d}</div>
                        </div>
                    `;
                });
                qContainer.innerHTML = qHTML;
            }

            // 4. רינדור טבלת אבות
            const piContainer = document.getElementById('pi-array-container');
            let piHTML = `
                <table class="w-full text-center border-collapse text-sm bg-white rounded-lg overflow-hidden shadow-sm border border-gray-200">
                    <thead>
                        <tr class="bg-gray-100 border-b border-gray-200 text-gray-600 font-bold text-xs">
                            <th class="py-1 px-2 border-r border-gray-200 font-serif italic">v</th>
                            <th class="py-1 px-2 border-r border-gray-200 font-serif">d[v]</th>
                            <th class="py-1 px-2 font-serif">&pi;[v]</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            const sortedNodes = [...nodesData].sort((a, b) => a.id.localeCompare(b.id));
            
            sortedNodes.forEach(n => {
                const nodeVal = state.nodes[n.id];
                const piVal = nodeVal.pi;
                const dVal = nodeVal.d;
                const displayPi = piVal === 'NIL' ? '&empty;' : piVal;
                
                const dClass = dVal !== '∞' ? 'text-emerald-600 font-bold bg-emerald-50/50 rounded px-1.5' : 'text-gray-300';
                const piClass = piVal !== 'NIL' ? 'text-blue-600 font-bold bg-blue-50/70 rounded px-1.5' : 'text-gray-300';

                piHTML += `
                    <tr class="border-b border-gray-100 last:border-b-0 hover:bg-gray-50/50 transition-colors">
                        <td class="py-1 px-2 border-r border-gray-200 font-serif font-bold italic text-gray-700 text-xs">${n.id}</td>
                        <td class="py-1 px-2 border-r border-gray-200 font-semibold ${dClass} text-xs">${dVal}</td>
                        <td class="py-1 px-2 font-semibold ${piClass} text-xs">${displayPi}</td>
                    </tr>
                `;
            });
            piHTML += `</tbody></table>`;
            piContainer.innerHTML = piHTML;

            // 5. רינדור קבוצת הקודקודים הסגורה S
            const sContainer = document.getElementById('s-set-container');
            sContainer.innerHTML = `S = { ${state.sSet.length > 0 ? state.sSet.join(', ') : '&empty;'} }`;
        }

        function nextStep() {
            if (currentStep < states.length - 1) {
                currentStep++;
                render();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        }

        function resetSimulation() {
            currentStep = 0;
            render();
        }

        // מעבר עם מקשי החצים במקלדת
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextStep();
            } else if (e.key === 'ArrowLeft') {
                prevStep();
            }
        });

        // אתחול בטוח לכל פלטפורמה
        generateDijkstraStates();
        render();

        window.onload = () => {
            generateDijkstraStates();
            render();
        };

    </script>
</body>
</html>
