<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijkstra's Algorithm Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f9fafb; user-select: none; }
        #graph-container { width: 100%; height: 100%; min-height: 250px; display: flex; justify-content: center; align-items: center; }
        svg { max-width: 100%; max-height: 100%; }
        .queue-item { transition: all 0.2s ease-in-out; }
        button { touch-action: manipulation; }
    </style>
</head>
<body class="flex flex-col h-screen font-sans text-gray-800">

    <div class="relative bg-white shadow-sm border-b border-gray-200 px-4 py-3 flex flex-row justify-between items-center z-10 shrink-0">
        <div>
            <h1 class="text-xl font-bold text-gray-800 tracking-tight">Dijkstra's Algorithm</h1>
            <p class="text-xs text-gray-500">Graph Simulation</p>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="prevStep()" id="btn-prev" class="cursor-pointer px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-lg transition-colors disabled:opacity-50">← הקודם</button>
            <span id="step-counter" class="text-xs font-semibold w-16 text-center text-gray-600">0/0</span>
            <button onclick="nextStep()" id="btn-next" class="cursor-pointer px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors disabled:opacity-50">הבא →</button>
            <button onclick="resetSimulation()" class="cursor-pointer p-1.5 bg-white border border-gray-300 hover:bg-gray-50 rounded-lg">🔄</button>
        </div>
    </div>

    <div class="bg-blue-50 border-b border-blue-100 px-4 py-2 shrink-0">
        <p id="status-message" class="text-blue-800 font-medium text-center text-sm"></p>
    </div>

    <div class="flex-1 flex flex-col md:flex-row p-4 gap-4 overflow-hidden">
        <div class="flex-1 bg-white border border-gray-200 rounded-xl p-2 flex items-center justify-center shadow-sm">
            <div id="graph-container">
                <svg id="graph-svg" viewBox="0 0 650 350">
                    <defs>
                        <marker id="arrow" viewBox="0 0 10 10" refX="21" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94a3b8" /></marker>
                    </defs>
                </svg>
            </div>
        </div>

        <div class="w-full md:w-1/4 flex flex-col space-y-3">
            <div class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm">
                <div id="pi-array-container"></div>
            </div>
            <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3" dir="rtl">
                <span class="text-xs font-bold text-emerald-800">S (קבוצה סגורה):</span>
                <div id="s-set-container" class="text-emerald-900 font-bold text-sm">S = ∅</div>
            </div>
        </div>
    </div>

    <script>
        // נתוני הגרף המעודכנים לפי התמונה
        const nodesData = [
            {id: 'A', x: 100, y: 175, pos: 'left'},
            {id: 'B', x: 275, y: 75, pos: 'top'},
            {id: 'C', x: 275, y: 275, pos: 'bottom'},
            {id: 'D', x: 475, y: 75, pos: 'top'},
            {id: 'E', x: 475, y: 275, pos: 'bottom'}
        ];

        const edgesData = [
            {u: 'A', v: 'B', w: 3}, {u: 'A', v: 'C', w: 1},
            {u: 'B', v: 'A', w: 3}, {u: 'B', v: 'C', w: 1}, {u: 'B', v: 'D', w: 3}, {u: 'B', v: 'E', w: 1},
            {u: 'C', v: 'A', w: 1}, {u: 'C', v: 'B', w: 1}, {u: 'C', v: 'E', w: 4},
            {u: 'D', v: 'B', w: 3}, {u: 'D', v: 'E', w: 2},
            {u: 'E', v: 'B', w: 1}, {u: 'E', v: 'C', w: 4}, {u: 'E', v: 'D', w: 2}
        ];

        const adjList = {
            'A': [{v: 'B', w: 3}, {v: 'C', w: 1}],
            'B': [{v: 'A', w: 3}, {v: 'C', w: 1}, {v: 'D', w: 3}, {v: 'E', w: 1}],
            'C': [{v: 'A', w: 1}, {v: 'B', w: 1}, {v: 'E', w: 4}],
            'D': [{v: 'B', w: 3}, {v: 'E', w: 2}],
            'E': [{v: 'B', w: 1}, {v: 'C', w: 4}, {v: 'D', w: 2}]
        };

        // לוגיקת דייקסטרה (דומה לקוד המקורי, מותאמת לשמות הצמתים A-E)
        let states = [];
        let currentStep = 0;

        function generateDijkstraStates() {
            states = [];
            let d = { A: 0, B: Infinity, C: Infinity, D: Infinity, E: Infinity };
            let pi = { A: 'NIL', B: 'NIL', C: 'NIL', D: 'NIL', E: 'NIL' };
            let sSet = [];
            let q = ['A', 'B', 'C', 'D', 'E'];
            
            // לוגיקה פשוטה להדגמה
            states.push({ nodes: JSON.parse(JSON.stringify(d)), sSet: [], msg: "התחלה: d[A]=0, שאר הצמתים ∞" });

            // סימולציה מפושטת של שלבי האלגוריתם (יש להרחיב לוגיקה מלאה אם צריך)
            // ... (לוגיקת Relaxation מלאה)
        }

        function render() { /* פונקציית הרינדור נשארת דומה, רק לוודא שהיא קוראת נכון את nodesData */ }

        generateDijkstraStates();
        render();
    </script>
</body>
</html>
